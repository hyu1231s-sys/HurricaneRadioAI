name: Legacy RC14.19 Assets Inspect
on:
  push:
    branches: [rc14.21-preview]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rejoin inherited asset archive
        run: |
          cat packed-rc1419/assets.b64.* | tr -d '\n\r ' | base64 -d > /tmp/rc1419-assets.tar.gz
          gzip -t /tmp/rc1419-assets.tar.gz
          tar -tzf /tmp/rc1419-assets.tar.gz | tee /tmp/assets.list
      - name: Verify required RC14.21 static assets
        run: |
          for f in \
            worker/op-ui-template.webp \
            worker/ed-ui-template.webp \
            assets/guest-presets/guest-00.webp \
            assets/guest-presets/guest-01.webp \
            assets/guest-presets/guest-02.webp \
            assets/guest-presets/guest-03.webp \
            assets/guest-presets/guest-04.webp \
            assets/guest-presets/guest-05.webp \
            assets/guest-presets/guest-06.webp \
            assets/guest-presets/guest-07.webp \
            assets/guest-presets/guest-08.webp \
            assets/guest-presets/guest-09.webp; do
            grep -Fx "$f" /tmp/assets.list
          done
