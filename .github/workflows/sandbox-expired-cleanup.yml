name: Cleanup Sandbox Snapshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sandbox-expired-cleanup.yml']
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep base + recent snapshots, remove old storage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_T7MRylRvLd04qtfhPCn52Rgi
          PROJECT_ID: prj_4Ic6K8bRGDMFEfmx83plLe7YJLdu
          BASE_SNAPSHOT: snap_mW7maB1otMUcQXf9G59Y4z4dO6Ip
          KEEP_LATEST: '3'
          KEEP_RECENT_HOURS: '6'
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN missing'; exit 2; }

          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/sandboxes/snapshots?project=$PROJECT_ID&limit=100&sortOrder=desc&teamId=$TEAM_ID" \
            -o /tmp/snapshots.json

          node <<'NODE' > /tmp/delete.txt
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/snapshots.json','utf8'));
          const rows=Array.isArray(j)?j:(Array.isArray(j.data)?j.data:(j.snapshots||j.data?.snapshots||[]));
          const base=process.env.BASE_SNAPSHOT;
          const keepLatest=Math.max(0,Number(process.env.KEEP_LATEST||3));
          const recentMs=Math.max(0,Number(process.env.KEEP_RECENT_HOURS||6))*3600*1000;
          const now=Date.now();
          const ts=s=>Number(s.lastUsedAt||s.updatedAt||s.createdAt||0);
          const active=rows.filter(s=>s&&s.id&&s.id!==base).sort((a,b)=>ts(b)-ts(a));
          const keep=new Set(active.slice(0,keepLatest).map(s=>s.id));
          for(const s of active){
            const t=ts(s);
            const recent=t>0 && now-t<=recentMs;
            if(keep.has(s.id) || recent) continue;
            console.log(s.id);
          }
          NODE

          before_count=$(node -e "const j=require('/tmp/snapshots.json');const r=Array.isArray(j)?j:(Array.isArray(j.data)?j.data:(j.snapshots||j.data?.snapshots||[]));console.log(r.length)")
          before_bytes=$(node -e "const j=require('/tmp/snapshots.json');const r=Array.isArray(j)?j:(Array.isArray(j.data)?j.data:(j.snapshots||j.data?.snapshots||[]));console.log(r.reduce((n,s)=>n+Number(s.sizeBytes||0),0))")
          candidates=$(grep -c '^snap_' /tmp/delete.txt || true)
          echo "snapshot_count_before=$before_count"
          echo "delete_candidate_count=$candidates"

          deleted=0
          while read -r id; do
            [ -n "$id" ] || continue
            echo "Deleting old snapshot $id"
            curl -fsS -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/sandboxes/snapshots/$id?teamId=$TEAM_ID" >/dev/null
            deleted=$((deleted+1))
          done < /tmp/delete.txt

          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/sandboxes/snapshots?project=$PROJECT_ID&limit=100&sortOrder=desc&teamId=$TEAM_ID" \
            -o /tmp/after.json

          BEFORE_COUNT="$before_count" BEFORE_BYTES="$before_bytes" DELETED="$deleted" node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'));
          const rows=Array.isArray(j)?j:(Array.isArray(j.data)?j.data:(j.snapshots||j.data?.snapshots||[]));
          const afterBytes=rows.reduce((n,s)=>n+Number(s.sizeBytes||0),0);
          const report={
            generatedAt:new Date().toISOString(),
            policy:{keepBase:process.env.BASE_SNAPSHOT,keepLatest:Number(process.env.KEEP_LATEST),keepRecentHours:Number(process.env.KEEP_RECENT_HOURS)},
            before:{count:Number(process.env.BEFORE_COUNT),bytes:Number(process.env.BEFORE_BYTES),gib:Number((Number(process.env.BEFORE_BYTES)/1073741824).toFixed(3))},
            deleted:Number(process.env.DELETED),
            after:{count:rows.length,bytes:afterBytes,gib:Number((afterBytes/1073741824).toFixed(3))},
            remaining:rows.map(s=>({id:s.id,sizeBytes:Number(s.sizeBytes||0),lastUsedAt:s.lastUsedAt||null,createdAt:s.createdAt||null,expiresAt:s.expiresAt||null,base:s.id===process.env.BASE_SNAPSHOT}))
          };
          fs.writeFileSync('SANDBOX_CLEANUP_REPORT.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE

      - name: Save cleanup report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SANDBOX_CLEANUP_REPORT.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Sandbox cleanup result"
          git push
