name: Cleanup Sandbox Snapshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sandbox-expired-cleanup.yml']
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup snapshots with guaranteed report
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_T7MRylRvLd04qtfhPCn52Rgi
          PROJECT_ID: prj_4Ic6K8bRGDMFEfmx83plLe7YJLdu
          BASE_SNAPSHOT: snap_mW7maB1otMUcQXf9G59Y4z4dO6Ip
          KEEP_LATEST: '3'
          KEEP_RECENT_HOURS: '6'
        run: |
          node <<'NODE'
          const fs=require('fs');
          const token=process.env.VERCEL_TOKEN||'';
          const team=process.env.TEAM_ID;
          const project=process.env.PROJECT_ID;
          const base=process.env.BASE_SNAPSHOT;
          const keepLatest=Math.max(0,Number(process.env.KEEP_LATEST||3));
          const keepRecentHours=Math.max(0,Number(process.env.KEEP_RECENT_HOURS||6));
          const report={ok:false,generatedAt:new Date().toISOString(),policy:{keepBase:base,keepLatest,keepRecentHours}};
          const norm=j=>Array.isArray(j)?j:(Array.isArray(j?.data)?j.data:(j?.snapshots||j?.data?.snapshots||[]));
          const bytes=r=>r.reduce((n,s)=>n+Number(s?.sizeBytes||0),0);
          const snapUrl=`https://api.vercel.com/v2/sandboxes/snapshots?project=${encodeURIComponent(project)}&limit=50&sortOrder=desc&teamId=${encodeURIComponent(team)}`;
          async function req(url,opts={}){
            const r=await fetch(url,{...opts,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(opts.headers||{})}});
            const text=await r.text();
            let json=null;try{json=JSON.parse(text)}catch{}
            return {status:r.status,ok:r.ok,text,json};
          }
          (async()=>{
            try{
              if(!token){report.stage='credential';report.error='VERCEL_TOKEN missing';return;}
              const first=await req(snapUrl);
              report.listStatus=first.status;
              if(!first.ok){report.stage='list';report.error=first.text.slice(0,2000);return;}
              const rows=norm(first.json);
              report.before={count:rows.length,bytes:bytes(rows),gib:Number((bytes(rows)/1073741824).toFixed(3))};
              const ts=s=>Number(s?.lastUsedAt||s?.updatedAt||s?.createdAt||0);
              const recentMs=keepRecentHours*3600*1000,now=Date.now();
              const others=rows.filter(s=>s?.id&&s.id!==base).sort((a,b)=>ts(b)-ts(a));
              const keep=new Set(others.slice(0,keepLatest).map(s=>s.id));
              const candidates=others.filter(s=>!keep.has(s.id)&&!(ts(s)>0&&now-ts(s)<=recentMs));
              report.candidates=candidates.map(s=>({id:s.id,sizeBytes:Number(s.sizeBytes||0),lastUsedAt:s.lastUsedAt||null,createdAt:s.createdAt||null,expiresAt:s.expiresAt||null}));
              report.deletionAttempts=[];
              for(const s of candidates){
                const del=await req(`https://api.vercel.com/v2/sandboxes/snapshots/${encodeURIComponent(s.id)}?teamId=${encodeURIComponent(team)}`,{method:'DELETE'});
                const alreadyGone=/expired or deleted/i.test(del.text);
                report.deletionAttempts.push({id:s.id,httpStatus:del.status,deleted:del.ok||alreadyGone,alreadyGone,body:del.text.slice(0,500)});
              }
              const after=await req(snapUrl);
              report.afterStatus=after.status;
              if(!after.ok){report.stage='relist';report.error=after.text.slice(0,2000);return;}
              const remaining=norm(after.json);
              report.deleted=report.deletionAttempts.filter(x=>x.deleted).length;
              report.after={count:remaining.length,bytes:bytes(remaining),gib:Number((bytes(remaining)/1073741824).toFixed(3))};
              report.remaining=remaining.map(s=>({id:s.id,sizeBytes:Number(s.sizeBytes||0),lastUsedAt:s.lastUsedAt||null,createdAt:s.createdAt||null,expiresAt:s.expiresAt||null,base:s.id===base}));
              report.ok=true;report.stage='cleanup-complete';
            }catch(e){report.stage=report.stage||'exception';report.error=String(e?.stack||e).slice(0,4000)}
            finally{fs.writeFileSync('SANDBOX_CLEANUP_REPORT.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));}
          })();
          NODE

      - name: Persistent capacity smoke like production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_T7MRylRvLd04qtfhPCn52Rgi
          PROJECT_ID: prj_4Ic6K8bRGDMFEfmx83plLe7YJLdu
          BASE_SNAPSHOT: snap_mW7maB1otMUcQXf9G59Y4z4dO6Ip
        run: |
          node <<'NODE'
          const fs=require('fs');
          const token=process.env.VERCEL_TOKEN||'';
          const team=process.env.TEAM_ID,project=process.env.PROJECT_ID,base=process.env.BASE_SNAPSHOT;
          const report=JSON.parse(fs.readFileSync('SANDBOX_CLEANUP_REPORT.json','utf8'));
          const name=`hrai-persistent-smoke-${process.env.GITHUB_RUN_ID||Date.now()}`;
          async function req(url,opts={}){
            const r=await fetch(url,{...opts,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(opts.headers||{})}});
            const text=await r.text();
            let json=null;try{json=JSON.parse(text)}catch{}
            return {status:r.status,ok:r.ok,text,json};
          }
          (async()=>{
            let created=false;
            try{
              const ttl=86400000;
              const body={name,projectId:project,source:{type:'snapshot',snapshotId:base},ports:[],timeout:120000,resources:{vcpus:2},persistent:true,snapshotExpiration:ttl,keepLastSnapshots:{count:1,expiration:ttl,deleteEvicted:true}};
              const create=await req(`https://api.vercel.com/v2/sandboxes?teamId=${encodeURIComponent(team)}`,{method:'POST',body:JSON.stringify(body)});
              created=create.ok;
              report.persistentCapacitySmoke={name,request:{persistent:true,snapshotExpiration:ttl},createStatus:create.status,created:create.ok,createBody:create.text.slice(0,2000)};
              report.persistentSandboxCapacityOk=create.ok;
              report.ok=Boolean(report.ok&&create.ok);
              report.stage=create.ok?'persistent-capacity-ok':'persistent-capacity-failed';
            }catch(e){report.persistentCapacitySmoke={name,created:false,error:String(e?.stack||e).slice(0,2000)};report.persistentSandboxCapacityOk=false;report.ok=false;report.stage='persistent-capacity-exception'}
            finally{
              const del=await req(`https://api.vercel.com/v2/sandboxes/${encodeURIComponent(name)}?projectId=${encodeURIComponent(project)}&teamId=${encodeURIComponent(team)}`,{method:'DELETE'}).catch(()=>null);
              if(report.persistentCapacitySmoke&&del){report.persistentCapacitySmoke.deleteStatus=del.status;report.persistentCapacitySmoke.deleted=del.ok||del.status===404;report.persistentCapacitySmoke.deleteBody=del.text.slice(0,800)}
              fs.writeFileSync('SANDBOX_CLEANUP_REPORT.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report.persistentCapacitySmoke));
            }
          })();
          NODE

      - name: Save cleanup report
        if: always()
        run: |
          test -f SANDBOX_CLEANUP_REPORT.json || printf '%s\n' '{"ok":false,"stage":"unknown","error":"report missing"}' > SANDBOX_CLEANUP_REPORT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main || true
          git add SANDBOX_CLEANUP_REPORT.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Sandbox cleanup result"
          git push

