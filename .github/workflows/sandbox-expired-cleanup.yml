name: Cleanup Sandbox Snapshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sandbox-expired-cleanup.yml']
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup with diagnostics
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_T7MRylRvLd04qtfhPCn52Rgi
          PROJECT_ID: prj_4Ic6K8bRGDMFEfmx83plLe7YJLdu
          BASE_SNAPSHOT: snap_mW7maB1otMUcQXf9G59Y4z4dO6Ip
          KEEP_LATEST: '3'
          KEEP_RECENT_HOURS: '6'
        run: |
          set -u
          : > /tmp/delete-results.ndjson
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            printf '%s\n' '{"ok":false,"stage":"credential","error":"VERCEL_TOKEN missing"}' > SANDBOX_CLEANUP_REPORT.json
            exit 0
          fi

          list_code=$(curl -sS -o /tmp/snapshots.json -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/sandboxes/snapshots?project=$PROJECT_ID&limit=100&sortOrder=desc&teamId=$TEAM_ID" || true)

          if [ "$list_code" != "200" ]; then
            LIST_CODE="$list_code" node <<'NODE'
            const fs=require('fs');
            let body='';try{body=fs.readFileSync('/tmp/snapshots.json','utf8').slice(0,2000)}catch{}
            fs.writeFileSync('SANDBOX_CLEANUP_REPORT.json',JSON.stringify({ok:false,generatedAt:new Date().toISOString(),stage:'list',httpStatus:Number(process.env.LIST_CODE||0),body},null,2)+'\n');
            NODE
            exit 0
          fi

          node <<'NODE' > /tmp/delete.txt
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/snapshots.json','utf8'));
          const rows=Array.isArray(j)?j:(Array.isArray(j.data)?j.data:(j.snapshots||j.data?.snapshots||[]));
          const base=process.env.BASE_SNAPSHOT;
          const keepLatest=Math.max(0,Number(process.env.KEEP_LATEST||3));
          const recentMs=Math.max(0,Number(process.env.KEEP_RECENT_HOURS||6))*3600*1000;
          const now=Date.now();
          const ts=s=>Number(s.lastUsedAt||s.updatedAt||s.createdAt||0);
          const active=rows.filter(s=>s&&s.id&&s.id!==base).sort((a,b)=>ts(b)-ts(a));
          const keep=new Set(active.slice(0,keepLatest).map(s=>s.id));
          for(const s of active){
            const t=ts(s), recent=t>0&&now-t<=recentMs;
            if(keep.has(s.id)||recent)continue;
            console.log(s.id);
          }
          NODE

          while read -r id; do
            [ -n "$id" ] || continue
            code=$(curl -sS -o /tmp/delete-body.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/sandboxes/snapshots/$id?teamId=$TEAM_ID" || true)
            ID="$id" CODE="$code" node <<'NODE' >> /tmp/delete-results.ndjson
            const fs=require('fs');
            let body='';try{body=fs.readFileSync('/tmp/delete-body.json','utf8').slice(0,1000)}catch{}
            console.log(JSON.stringify({id:process.env.ID,httpStatus:Number(process.env.CODE||0),deleted:String(process.env.CODE)==='200',body}));
            NODE
          done < /tmp/delete.txt

          after_code=$(curl -sS -o /tmp/after.json -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/sandboxes/snapshots?project=$PROJECT_ID&limit=100&sortOrder=desc&teamId=$TEAM_ID" || true)

          AFTER_CODE="$after_code" node <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/snapshots.json','utf8'));
          const norm=j=>Array.isArray(j)?j:(Array.isArray(j.data)?j.data:(j.snapshots||j.data?.snapshots||[]));
          const b=norm(before);
          let a=[];try{if(process.env.AFTER_CODE==='200')a=norm(JSON.parse(fs.readFileSync('/tmp/after.json','utf8')))}catch{}
          const del=fs.readFileSync('/tmp/delete-results.ndjson','utf8').trim().split(/\n+/).filter(Boolean).map(x=>JSON.parse(x));
          const bytes=r=>r.reduce((n,s)=>n+Number(s.sizeBytes||0),0);
          const report={
            ok:process.env.AFTER_CODE==='200',generatedAt:new Date().toISOString(),
            policy:{keepBase:process.env.BASE_SNAPSHOT,keepLatest:Number(process.env.KEEP_LATEST),keepRecentHours:Number(process.env.KEEP_RECENT_HOURS)},
            before:{count:b.length,bytes:bytes(b),gib:Number((bytes(b)/1073741824).toFixed(3))},
            deletionAttempts:del,deleted:del.filter(x=>x.deleted).length,
            after:{httpStatus:Number(process.env.AFTER_CODE||0),count:a.length,bytes:bytes(a),gib:Number((bytes(a)/1073741824).toFixed(3))},
            remaining:a.map(s=>({id:s.id,sizeBytes:Number(s.sizeBytes||0),lastUsedAt:s.lastUsedAt||null,createdAt:s.createdAt||null,expiresAt:s.expiresAt||null,base:s.id===process.env.BASE_SNAPSHOT}))
          };
          fs.writeFileSync('SANDBOX_CLEANUP_REPORT.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE

      - name: Save cleanup report
        if: always()
        run: |
          test -f SANDBOX_CLEANUP_REPORT.json || printf '%s\n' '{"ok":false,"stage":"unknown","error":"report missing"}' > SANDBOX_CLEANUP_REPORT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main || true
          git add SANDBOX_CLEANUP_REPORT.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Sandbox cleanup result"
          git push

