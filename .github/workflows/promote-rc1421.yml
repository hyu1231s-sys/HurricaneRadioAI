name: Promote RC14.21 to Production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-rc1421.yml']

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel deploy credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not configured; production promotion was not attempted."
            exit 2
          fi
      - name: Promote validated RC14.21 Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: https://hurricane-radio-7wzx01bx1-hyu1231s-2033s-projects.vercel.app
        run: |
          npx --yes vercel@latest promote "$PREVIEW_URL" --yes --token "$VERCEL_TOKEN" --scope hyu1231s-2033s-projects --timeout 5m
      - name: Verify production health
        run: |
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS https://hurricane-radio-ai.vercel.app/api/health || true)"
            echo "$body"
            echo "$body" | grep -F '4.4.21-rc14.21-longform-eta' && exit 0
            sleep 5
          done
          echo "::error::Production health did not report RC14.21"
          exit 1
      - name: Verify OpenAI status
        run: |
          body="$(curl -fsS https://hurricane-radio-ai.vercel.app/api/openai-status)"
          echo "$body"
          echo "$body" | grep -F '"configured":true'
          echo "$body" | grep -F '"reachable":true'
          echo "$body" | grep -F '"model":"gpt-4o-transcribe-diarize"'
      - name: Verify worker status
        run: |
          body="$(curl -fsS https://hurricane-radio-ai.vercel.app/api/worker-status)"
          echo "$body"
          echo "$body" | grep -F '"ready":true'
          echo "$body" | grep -F '"ffmpeg":true'
          echo "$body" | grep -F '"japaneseFont":true'
          echo "$body" | grep -F '"resumable":true'
      - name: Verify production smoke remains owner protected
        run: |
          code="$(curl -sS -o /tmp/smoke.json -w '%{http_code}' https://hurricane-radio-ai.vercel.app/api/start-job-smoke)"
          cat /tmp/smoke.json
          test "$code" = "401"
          grep -F '"error":"owner_access_required"' /tmp/smoke.json
