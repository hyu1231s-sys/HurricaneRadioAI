name: Restore RC14.2 source

on:
  push:
    branches: [main]
    paths:
      - 'packed/**'
      - 'scripts/restore-rc142.mjs'
      - '.github/workflows/restore-rc142.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-rc142.mjs
      - name: Verify restored files
        run: |
          node --check api/app.js
          node --check worker/hrai-pipeline.mjs
          node --check worker/worker-server.mjs
          test -s index.html
          test -s assets/guest-presets/guest-00.webp
          test -s assets/guest-presets/guest-09.webp
      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html api/app.js worker/hrai-pipeline.mjs worker/worker-server.mjs assets/guest-presets
          if git diff --cached --quiet; then
            echo "No restored changes to commit"
            exit 0
          fi
          git commit -m "Restore HurricaneRadioAI RC14.2 source"
          git push
